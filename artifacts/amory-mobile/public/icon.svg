<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Gear Wheel -->
  <g fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" transform="translate(256, 230)">
    <!-- Gear Ring -->
    <circle r="120" />
    <!-- Gear Teeth -->
    <path d="M 0 -150 L 0 -120" />
    <path d="M 106 -106 L 85 -85" />
    <path d="M 150 0 L 120 0" />
    <path d="M 106 106 L 85 85" />
    <path d="M 0 150 L 0 120" />
    <path d="M -106 106 L -85 85" />
    <path d="M -150 0 L -120 0" />
    <path d="M -106 -106 L -85 -85" />
  </g>
  
  <!-- Piston / Brake Disc Emblem in center -->
  <circle cx="256" cy="230" r="60" fill="#3b82f6" opacity="0.2" />
  <circle cx="256" cy="230" r="30" fill="#60a5fa" />
  
  <!-- Wrench & Screwdriver Crossed Icon Accent -->
  <path d="M 190 290 L 322 170" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" />
  <path d="M 322 290 L 190 170" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" />

  <!-- Arabic Typography "العموري" -->
  <text x="256" y="440" font-family="Cairo, Arial, sans-serif" font-size="52" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">الـعـمـوري</text>
  <text x="256" y="475" font-family="Cairo, Arial, sans-serif" font-size="20" font-weight="700" fill="#94a3b8" text-anchor="middle">قطع غيار سيارات</text>
</svg>
